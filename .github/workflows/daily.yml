name: Daily research update
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'full=采集、评分、精选和摘要；summaries=补当天精选摘要；daily=仅更新精选和摘要'
        type: choice
        options: [full, summaries, daily]
        default: full
      summary_limit:
        description: '本轮摘要尝试上限（0–100；可能产生 API 费用）'
        type: number
        default: 12
  schedule:
    - cron: '7 0 * * *' # 北京时间每天 08:07，云端调度可能延迟
  push:
    branches: [main]
    paths: ['scripts/**', 'site/**', 'data/curated_summaries.json', 'config.json', '.github/workflows/daily.yml']

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: embodied-radar-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check collector
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check filters
        run: node --test scripts/test_filters.cjs
      - name: Collect articles
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_FORMAT: ${{ vars.OPENAI_API_FORMAT }}
          UPDATE_TASK: ${{ inputs.task || 'full' }}
          SUMMARY_LIMIT: ${{ inputs.summary_limit }}
        run: |
          args=()
          if [ "$UPDATE_TASK" = "summaries" ]; then args+=(--summaries-only); fi
          if [ "$UPDATE_TASK" = "daily" ]; then args+=(--daily-only); fi
          if [ -n "$SUMMARY_LIMIT" ]; then args+=(--summary-limit "$SUMMARY_LIMIT"); fi
          python scripts/collect.py "${args[@]}"
      - name: Report daily selection
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('site/data.json').read_text(encoding='utf-8'))
          edition = data['daily_editions'][0]
          message = f"每日精选 {edition['date']} — {len(edition['items'])}/12 篇，中文摘要 {edition['summary_count']}/{len(edition['items'])} 篇。\n"
          if edition['state'] != 'complete':
              message += '本期尚未完整生成，请检查候选数量及中文摘要配置或额度。\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(message)
          PY
      - name: Save history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update research records [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
          for attempt in range(12):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Cache-Control': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == os.environ['PAGES_ARTIFACT'] and not a['expired']]
              if len(matches) == 1:
                  print('Pages artifact is available for deployment.')
                  break
              if len(matches) > 1:
                  raise SystemExit('Unexpected duplicate Pages artifacts.')
              time.sleep(5)
          else:
              raise SystemExit('Pages artifact did not become visible within one minute.')
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
