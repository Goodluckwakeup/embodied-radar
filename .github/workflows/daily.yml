name: Daily research update
on:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * *' # 北京时间每天 08:07，云端调度可能延迟
  push:
    branches: [main]
    paths: ['scripts/**', 'site/**', 'config.json', '.github/workflows/daily.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: embodied-radar-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check collector
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Collect articles
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/collect.py
      - name: Save history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update research records [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
